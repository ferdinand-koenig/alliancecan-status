# Builds AllianceStatus-Setup.exe on GitHub's free Windows runners.
# - Push to main: builds and publishes as a Release draft (you review before publishing).
# - Push a tag like v1.0.0: builds and publishes as a Release immediately.
# - Manual: use Actions tab "Run workflow" button.
name: Build installer

on:
  workflow_dispatch
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test -c Release
        continue-on-error: true

      - name: Publish standalone exe
        shell: pwsh
        run: ./publish.ps1 -Mode standalone -Runtime win-x64

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer\AllianceStatus.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: AllianceStatus-Setup
          path: |
            dist/AllianceStatus-Setup.exe
            dist/AllianceStatus-win-x64-standalone.zip

      - name: Detect version from tag or main
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            DRAFT=false
          else
            VERSION="main-${{ github.run_number }}"
            DRAFT=true
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "draft=$DRAFT" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          draft: ${{ steps.version.outputs.draft }}
          files: |
            dist/AllianceStatus-Setup.exe
            dist/AllianceStatus-win-x64-standalone.zip
