# Builds AllianceStatus-Setup.exe on GitHub's free Windows runners.
# - Push a tag like v1.0.0: builds with version 1.0.0 and publishes a Release.
# - Manual: Actions tab → "Run workflow" (builds artifacts only, no Release).
name: Build installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Work out version
        shell: pwsh
        run: |
          $ref = '${{ github.ref_name }}'
          if ('${{ github.ref_type }}' -eq 'tag' -and $ref -match '^v?(\d+\.\d+\.\d+)') {
            $version = $Matches[1]
          } else {
            $version = '0.0.0'
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Building version $version"

      - name: Test
        run: dotnet test -c Release
        continue-on-error: true

      - name: Publish standalone exe
        shell: pwsh
        run: ./publish.ps1 -Mode standalone -Runtime win-x64 -Version $env:APP_VERSION

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer\AllianceStatus.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - uses: actions/upload-artifact@v5
        with:
          name: AllianceStatus-Setup
          path: |
            dist/AllianceStatus-Setup.exe
            dist/AllianceStatus-win-x64-standalone.zip

      - name: Create Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AllianceStatus-Setup.exe
            dist/AllianceStatus-win-x64-standalone.zip
