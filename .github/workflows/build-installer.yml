# Builds AllianceStatus-Setup.exe on GitHub's free Windows runners.
# - Push a tag like v1.0.0: builds and publishes as a Release immediately.
# - Manual: use Actions tab "Run workflow" button (builds but doesn't release).
name: Build installer

on:
  workflow_dispatch
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test -c Release
        continue-on-error: true

      - name: Publish standalone exe
        shell: pwsh
        run: ./publish.ps1 -Mode standalone -Runtime win-x64

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer\AllianceStatus.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - uses: actions/upload-artifact@v4.4.3
        with:
          name: AllianceStatus-Setup
          path: |
            dist/AllianceStatus-Setup.exe
            dist/AllianceStatus-win-x64-standalone.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2.1.0
        with:
          files: |
            dist/AllianceStatus-Setup.exe
            dist/AllianceStatus-win-x64-standalone.zip
